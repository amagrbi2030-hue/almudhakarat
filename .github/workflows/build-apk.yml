# يبني تطبيق «المذاكرات الإيمانية» بصيغة APK تلقائياً من ملف index.html
# النتيجة تظهر في صفحة Releases بالمستودع جاهزة للتحميل
name: بناء تطبيق أندرويد APK

on:
  push:
    branches: [main, master]
    paths: ['*.zip', 'index.html', 'icon-192.png', 'icon-512.png', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: فك الملف المضغوط وترتيب المستودع
        shell: bash
        run: |
          if ls *.zip >/dev/null 2>&1; then
            # فك الملفات من الأقدم إلى الأحدث حتى تبقى النسخة الأحدث هي الأخيرة
            for z in *.zip; do echo "$(git log -1 --format=%ct -- "$z") $z"; done | sort -n | cut -d' ' -f2- > /tmp/zips.txt
            while IFS= read -r z; do echo "فك: $z"; unzip -o -q "$z" -d . && git rm -q "$z"; done < /tmp/zips.txt
            rm -rf __MACOSX
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "فك ملفات التطبيق وترتيبها [skip ci]" && git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
          test -f index.html || { echo "لم يتم العثور على index.html"; exit 1; }

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: إنشاء مشروع أندرويد
        shell: bash
        run: |
          set -e
          A=android/app/src/main
          mkdir -p $A/java/com/mudhakarat/app $A/assets $A/res/values $A/res/mipmap-xxxhdpi
          cp index.html $A/assets/index.html
          echo '' | base64 -d > android/app-key.jks

          cat > android/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Almudhakarat'
          include ':app'
          EOT

          cat > android/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT

          cat > android/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOT

          cat > android/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
          android {
              namespace 'com.mudhakarat.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mudhakarat.app'
                  minSdk 21
                  targetSdk 34
                  versionCode run
                  versionName "1.${run}"
              }
              signingConfigs {
                  release {
                      storeFile file('../app-key.jks')
                      storePassword 'mudhakarat'
                      keyAlias 'mudhakarat'
                      keyPassword 'mudhakarat'
                  }
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.release }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint { checkReleaseBuilds false; abortOnError false }
              aaptOptions { noCompress 'html' }
          }
          EOT

          cat > $A/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT

          cat > $A/res/values/strings.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">المذاكرات الإيمانية</string></resources>
          EOT

          cat > $A/res/values/styles.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
              <color name="bg">#1F4D3A</color>
          </resources>
          EOT

          cat > $A/java/com/mudhakarat/app/MainActivity.java <<'EOT'
          package com.mudhakarat.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF1F4D3A);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          if ("file".equals(r.getUrl().getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) { }
                          return true;
                      }
                  });
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.appBack&&window.appBack())?'1':'0'", v -> {
                      if (v == null || !v.contains("1")) finish();
                  });
              }
          }
          EOT

          if [ -f icon-192.png ]; then cp icon-192.png $A/res/mipmap-xxxhdpi/ic_launcher.png
          elif [ -f icon-512.png ]; then cp icon-512.png $A/res/mipmap-xxxhdpi/ic_launcher.png
          else sed -i 's#@mipmap/ic_launcher#@android:drawable/sym_def_app_icon#g' $A/AndroidManifest.xml; fi

      - name: بناء ملف APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk Almudhakarat.apk

      - name: حفظ نسخة في صفحة التشغيل
        uses: actions/upload-artifact@v4
        with:
          name: Almudhakarat-apk
          path: Almudhakarat.apk

      - name: نشر الملف في صفحة الإصدارات
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: المذاكرات الإيمانية 1.${{ github.run_number }}
          body: ملف تثبيت تطبيق «المذاكرات الإيمانية» لأجهزة أندرويد. نزّل ملف Almudhakarat.apk وافتحه على جوالك لتثبيته.
          files: Almudhakarat.apk
